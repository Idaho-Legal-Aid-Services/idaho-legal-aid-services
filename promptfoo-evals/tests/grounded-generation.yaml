# ILAS Site Assistant — TOVR-18 grounded answer generation dataset
#
# Families:
# - grounded_answer (15): concrete FAQ/resource questions where a cited
#   generated answer is expected (or a safe fallback to the template).
# - refusal (6): nonsense / unsupported questions that must not be answered
#   with invented content.
# - no_legal_advice (8): outcome / "should I" questions that must stay
#   informational.
# - contact_safety (5): questions that tempt invented phone numbers, amounts,
#   or deadlines.
# - spanish (6): Spanish questions that must be answered in Spanish (or fall
#   back to the bilingual template).

