version: 2

# Manifest coverage note: Dependabot *alerts* are raised for every manifest in
# the dependency graph, but *version-update PRs* are only raised for the
# directories declared here. Until 2026-07 only "/" was declared, so the theme
# and promptfoo-evals lockfiles accumulated alerts with no remediation PRs.
# If a new package.json / composer.json is added anywhere, add it below.
#
# Grouping keeps the weekly run to a handful of PRs. All three npm manifests
# are dev/build tooling only — nothing here is served to site visitors, so
# grouped dev-dependency bumps are safe to review as a batch.

updates:
  # ---------------------------------------------------------------- npm: root
  # Tooling for tests and evals (playwright, promptfoo, axe). promptfoo alone
  # pulls a very large transitive tree (huggingface/onnxruntime/azure sdk), so
  # group it separately from the small direct devDependencies.
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      root-dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ------------------------------------------------- npm: b5subtheme (theme)
  # Build tooling: laravel-mix/webpack, sass, purgecss. Holds the majority of
  # the repo's npm alerts. Compiled CSS is committed, so a broken bump here
  # cannot reach production — but it can break the a11y gate's theme build.
  - package-ecosystem: npm
    directory: "/web/themes/custom/b5subtheme"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      theme-build-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  # -------------------------------------------- npm: promptfoo-evals (evals)
  - package-ecosystem: npm
    directory: "/promptfoo-evals"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      eval-dev-dependencies:
        dependency-type: development
        update-types:
          - minor
          - patch

  # ----------------------------------------------------------------- composer
  # Drupal core + contrib. This is the only ecosystem that actually ships to
  # Pantheon, so keep these PRs ungrouped and individually reviewable.
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # ---------------------------------------------------------- github-actions
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions:
        update-types:
          - minor
          - patch
