name: Site Smoke

# Requests the public pages of every Pantheon environment and tells someone
# when one of them is broken.
#
# Deploy-time checks only run when the person deploying uses the deploy
# script. Code also reaches Pantheon by other routes (the dashboard, direct
# pushes to the Pantheon remote), and an environment can break with no deploy
# at all: a database copy, a vendor change, an expired index. This run does
# not depend on anyone remembering anything.
#
# Triggers:
#   schedule             once a day
#   workflow_dispatch    by hand
#   repository_dispatch  type "pantheon-deploy", sent by the Pantheon
#                        Quicksilver hook after any code sync or deploy
on:
  schedule:
    - cron: '17 13 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [pantheon-deploy]

permissions:
  contents: read
  issues: write

concurrency:
  group: site-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Tells the maintainer when code reached Pantheon from someone else.
  #
  # Code is meant to arrive through GitHub: a pull request, CI, then a push to
  # Pantheon by the maintainer. Another party with access to the Pantheon
  # remote can push there directly, and those changes are otherwise only
  # discovered when the next publish refuses to overwrite them. The Pantheon
  # hook reports who triggered each code sync or deploy; when that is not one
  # of the expected deployers, this opens an issue (or adds to the open one)
  # whether or not anything broke.
  #
  # vars.PANTHEON_EXPECTED_DEPLOYER holds the name(s) Pantheon reports for
  # the maintainer, comma separated. Workflows Pantheon starts itself report
  # "Pantheon" and are not flagged.
  external-change-notice:
    name: Flag code changed on Pantheon by someone else
    if: ${{ github.event_name == 'repository_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      EXPECTED_DEPLOYERS: ${{ vars.PANTHEON_EXPECTED_DEPLOYER || '' }}
      DEPLOY_ENV: ${{ github.event.client_payload.environment || 'unknown' }}
      DEPLOY_WORKFLOW: ${{ github.event.client_payload.workflow || 'unknown' }}
      DEPLOY_USER: ${{ github.event.client_payload.user || 'unknown' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Compare the deployer with the expected ones
        id: who
        run: |
          normalize() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g'; }
          user="$(normalize "$DEPLOY_USER")"
          external=true
          if [[ "$user" == "pantheon" ]]; then
            external=false
          fi
          IFS=',' read -r -a expected <<< "$EXPECTED_DEPLOYERS"
          for name in "${expected[@]}"; do
            if [[ -n "$(normalize "$name")" && "$user" == "$(normalize "$name")" ]]; then
              external=false
            fi
          done
          if [[ -z "$(normalize "$EXPECTED_DEPLOYERS")" ]]; then
            echo "::warning::PANTHEON_EXPECTED_DEPLOYER is not set, so every code change on Pantheon is flagged. Set it to the name Pantheon reports for the maintainer."
          fi
          echo "external=${external}" >> "$GITHUB_OUTPUT"
          {
            echo "### Pantheon ${DEPLOY_WORKFLOW} on ${DEPLOY_ENV}"
            echo ""
            echo "- Triggered by: \`${DEPLOY_USER}\`"
            echo "- Outside the GitHub flow: \`${external}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update the notice
        if: ${{ steps.who.outputs.external == 'true' }}
        run: |
          gh label create external-push --color D93F0B \
            --description "Code reached Pantheon from someone other than the maintainer" --force

          when="$(date -u '+%Y-%m-%d %H:%M UTC')"
          {
            echo "**${DEPLOY_USER}** triggered \`${DEPLOY_WORKFLOW}\` on Pantheon **${DEPLOY_ENV}** at ${when}."
            echo ""
            echo "This did not come through the GitHub pull-request flow, so it had no CI and no review, and GitHub \`master\` may now be behind Pantheon."
            echo ""
            echo "To see and adopt the change:"
            echo '```bash'
            echo 'terminus env:code-log idaho-legal-aid-services.dev --format=table'
            echo 'npm run git:reconcile-origin -- --dry-run'
            echo '```'
            echo ""
            echo "The site smoke for this change: ${RUN_URL}"
          } > body.md

          title="Code changed on Pantheon outside the GitHub flow"
          existing="$(gh issue list --state open --label external-push --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label external-push --body-file body.md
          fi

  smoke:
    name: Smoke (${{ matrix.environment }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, test, live]
    env:
      # The pantheonsite.io host is used for live as well: Cloudflare
      # challenges scripted clients on the public host.
      BASE_URL: https://${{ matrix.environment }}-idaho-legal-aid-services.pantheonsite.io
      SMOKE_ENV: ${{ matrix.environment }}
      TRIGGER: ${{ github.event_name }}
      DEPLOY_ENV: ${{ github.event.client_payload.environment || '' }}
      DEPLOY_WORKFLOW: ${{ github.event.client_payload.workflow || '' }}
      DEPLOY_USER: ${{ github.event.client_payload.user || '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Node.js 20
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '20'

      - name: Record what triggered this run
        run: |
          {
            echo "### Site smoke: ${SMOKE_ENV}"
            echo ""
            echo "- Trigger: \`${TRIGGER}\`"
            if [[ -n "${DEPLOY_WORKFLOW}" ]]; then
              echo "- Pantheon workflow: \`${DEPLOY_WORKFLOW}\` on \`${DEPLOY_ENV}\` by \`${DEPLOY_USER:-unknown}\`"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # The Pantheon hook fires as the platform workflow finishes, while
      # database updates and the config import from the deploy script may
      # still be running. Give them time before judging the environment.
      - name: Wait for the deploy to settle
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: sleep 180

      - name: Site smoke
        id: site
        run: |
          set -o pipefail
          node scripts/smoke/site-smoke.mjs --base-url "$BASE_URL" --env "$SMOKE_ENV" | tee site-smoke.log

      # The assistant smoke posts one message, so it runs on dev only. On live
      # it would add to real conversation analytics. On test it queues a
      # Langfuse trace that nothing exports before the environment goes back to
      # sleep, and the trace then ages out with a stale-queue warning (Sentry
      # PHP-CA). Test and live get the assistant smoke from the deploy command,
      # which drains test's queue straight afterwards.
      - name: Assistant smoke
        id: assistant
        if: ${{ always() && matrix.environment == 'dev' }}
        run: |
          set -o pipefail
          node scripts/smoke/assistant-smoke.mjs --base-url "$BASE_URL" --mode production-safe --env "$SMOKE_ENV" | tee assistant-smoke.log

      - name: Open or update the failure issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create smoke-failure --color B60205 \
            --description "A scheduled or post-deploy smoke check failed" --force

          {
            echo "The site smoke failed on **${SMOKE_ENV}** (${BASE_URL})."
            echo ""
            echo "- Run: ${RUN_URL}"
            echo "- Trigger: \`${TRIGGER}\`"
            if [[ -n "${DEPLOY_WORKFLOW}" ]]; then
              echo "- Pantheon workflow: \`${DEPLOY_WORKFLOW}\` on \`${DEPLOY_ENV}\` by \`${DEPLOY_USER:-unknown}\`"
            fi
            echo ""
            echo "Failed checks:"
            echo '```'
            grep -h '^\[FAIL\]' site-smoke.log assistant-smoke.log 2>/dev/null || echo "(no [FAIL] lines captured; see the run log)"
            echo '```'
          } > body.md

          title="Site smoke failing on ${SMOKE_ENV}"
          existing="$(gh issue list --state open --label smoke-failure --search "in:title \"${title}\"" --json number --jq '.[0].number // empty')"
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label smoke-failure --body-file body.md
          fi

      - name: Note recovery on an open failure issue
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Site smoke failing on ${SMOKE_ENV}"
          existing="$(gh issue list --state open --label smoke-failure --search "in:title \"${title}\"" --json number --jq '.[0].number // empty' 2>/dev/null || true)"
          if [[ -n "$existing" ]]; then
            gh issue close "$existing" --comment "Passing again: ${RUN_URL}"
          fi
