ilas_site_assistant_governance.conversation_detail:
  path: '/admin/reports/ilas-assistant/governance/conversations/{conversation_id}'
  defaults:
    _controller: '\Drupal\ilas_site_assistant_governance\Controller\GovernanceConversationController::detail'
    _title: 'Conversation Detail'
  requirements:
    _permission: 'view assistant governance conversations'
    conversation_id: '[a-f0-9\-]{36}'

ilas_site_assistant_governance.flag_conversation_turn:
  path: '/admin/reports/ilas-assistant/governance/conversations/{conversation_id}/turns/{turn_sequence}/flag'
  defaults:
    _controller: '\Drupal\ilas_site_assistant_governance\Controller\GovernanceConversationController::flagTurn'
  requirements:
    _permission: 'flag assistant conversation turns'
    _csrf_token: 'TRUE'
    conversation_id: '[a-f0-9\-]{36}'
    turn_sequence: '\d+'

ilas_site_assistant_governance.gap_add_topic_alias:
  path: '/admin/reports/ilas-assistant/gaps/{assistant_gap_item}/add-alias'
  defaults:
    _form: '\Drupal\ilas_site_assistant_governance\Form\AssistantGapItemAddTopicAliasForm'
    _title: 'Add topic alias'
  requirements:
    _permission: 'edit assistant gap items'
    _entity_access: 'assistant_gap_item.update'
  options:
    parameters:
      assistant_gap_item:
        type: 'entity:assistant_gap_item'

ilas_site_assistant_governance.candidate_export:
  path: '/admin/reports/ilas-assistant/gaps/export'
  defaults:
    _controller: '\Drupal\ilas_site_assistant_governance\Controller\CandidateExportController::page'
    _title: 'Eval export'
  requirements:
    _permission: 'view assistant gap items'

ilas_site_assistant_governance.candidate_export_run:
  path: '/admin/reports/ilas-assistant/gaps/export/run'
  defaults:
    _controller: '\Drupal\ilas_site_assistant_governance\Controller\CandidateExportController::run'
  requirements:
    _permission: 'edit assistant gap items'
    _csrf_token: 'TRUE'

ilas_site_assistant_governance.candidate_export_download:
  path: '/admin/reports/ilas-assistant/gaps/export/download'
  defaults:
    _controller: '\Drupal\ilas_site_assistant_governance\Controller\CandidateExportController::download'
  requirements:
    _permission: 'view assistant gap items'

ilas_site_assistant_governance.gap_bulk_resolve_confirm:
  path: '/admin/reports/ilas-assistant/gaps/bulk/resolve'
  defaults:
    _form: '\Drupal\ilas_site_assistant_governance\Form\AssistantGapItemBulkDispositionForm'
    _title: 'Bulk resolve gap items'
  requirements:
    _permission: 'view assistant gap items'

ilas_site_assistant_governance.gap_bulk_archive_confirm:
  path: '/admin/reports/ilas-assistant/gaps/bulk/archive'
  defaults:
    _form: '\Drupal\ilas_site_assistant_governance\Form\AssistantGapItemBulkDispositionForm'
    _title: 'Bulk archive gap items'
  requirements:
    _permission: 'view assistant gap items'

ilas_site_assistant_governance.gap_start_review:
  path: '/admin/reports/ilas-assistant/gaps/{assistant_gap_item}/start-review'
  defaults:
    _controller: '\Drupal\ilas_site_assistant_governance\Controller\GapReviewWorkflowController::startReview'
  requirements:
    _custom_access: '\Drupal\ilas_site_assistant_governance\Controller\GapReviewWorkflowController::startReviewAccess'
    _csrf_token: 'TRUE'
