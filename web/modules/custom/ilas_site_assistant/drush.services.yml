services:
  ilas_site_assistant.commands:
    class: \Drupal\ilas_site_assistant\Commands\KbImportCommands
    arguments: ['@entity_type.manager', '@extension.list.module', '@ilas_site_assistant.top_intents_pack']
    tags:
      - { name: drush.command }
  ilas_site_assistant.sentry_probe_commands:
    class: \Drupal\ilas_site_assistant\Commands\SentryProbeCommands
    tags:
      - { name: drush.command }
  ilas_site_assistant.langfuse_probe_commands:
    class: \Drupal\ilas_site_assistant\Commands\LangfuseProbeCommands
    arguments: ['@config.factory', '@queue', '@http_client', '@ilas_site_assistant.runtime_truth_snapshot_builder', '@ilas_site_assistant.queue_health_monitor', '@ilas_site_assistant.slo_definitions']
    tags:
      - { name: drush.command }
  ilas_site_assistant.runtime_truth_commands:
    class: \Drupal\ilas_site_assistant\Commands\RuntimeTruthCommands
    arguments: ['@ilas_site_assistant.runtime_truth_snapshot_builder']
    tags:
      - { name: drush.command }
  ilas_site_assistant.langfuse_status_commands:
    class: \Drupal\ilas_site_assistant\Commands\LangfuseStatusCommands
    arguments: ['@ilas_site_assistant.runtime_truth_snapshot_builder', '@ilas_site_assistant.queue_health_monitor', '@ilas_site_assistant.slo_definitions', '@config.factory']
    tags:
      - { name: drush.command }
  ilas_site_assistant.langfuse_lookup_commands:
    class: \Drupal\ilas_site_assistant\Commands\LangfuseLookupCommands
    arguments: ['@ilas_site_assistant.langfuse_trace_lookup']
    tags:
      - { name: drush.command }
  ilas_site_assistant.runtime_diagnostics_commands:
    class: \Drupal\ilas_site_assistant\Commands\RuntimeDiagnosticsCommands
    arguments: ['@service_container']
    tags:
      - { name: drush.command }
  ilas_site_assistant.cohere_probe_commands:
    class: \Drupal\ilas_site_assistant\Commands\CohereProbeCommands
    arguments: ['@ilas_site_assistant.cohere_generation_probe']
    tags:
      - { name: drush.command }
  ilas_site_assistant.provider_health_commands:
    class: \Drupal\ilas_site_assistant\Commands\ProviderHealthCommands
    arguments: ['@ilas_site_assistant.provider_health_check']
    tags:
      - { name: drush.command }
  ilas_site_assistant.vector_maintenance_commands:
    class: \Drupal\ilas_site_assistant\Commands\VectorMaintenanceCommands
    arguments: ['@ilas_site_assistant.vector_index_hygiene']
    tags:
      - { name: drush.command }
  ilas_site_assistant.disambiguation_review_commands:
    class: \Drupal\ilas_site_assistant\Commands\DisambiguationReviewCommands
    arguments: ['@ilas_site_assistant.analytics_logger']
    tags:
      - { name: drush.command }
