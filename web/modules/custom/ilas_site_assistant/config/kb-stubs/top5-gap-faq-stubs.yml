  - id: faq_employment_fired
    type: faq_item
    review_status: revised
    review_notes:
      - "Revised 2026-09-22 from the reviewer's round-1 notes on the ILAS FAQ Sign-off Sheet; awaiting re-approval in round 2."
    category: Employment
    anchor_id: what-if-i-was-fired-unfairly
    question: "What if I was fired unfairly?"
    answer: |
      Idaho is an "at-will" employment state. That means an employer can fire
      you for almost any reason, or for no reason at all. A firing that is merely
      unfair, unkind, or without good cause is NOT illegal by itself. A firing is
      unlawful only when it falls within a recognized exception:

      1. Discrimination - The Idaho Human Rights Act (Idaho Code 67-5909) bars
         firing you because of race, color, religion, sex (including pregnancy),
         national origin, age (40 and older), or disability. It applies to
         employers with 5 or more employees. Federal law covers the same grounds
         for larger employers (Title VII and the ADA: 15 or more employees; the
         ADEA: 20 or more) and also protects sexual orientation and gender
         identity, which Idaho state law does not.

      2. Retaliation for protected activity - Where the protection comes from
         matters:
         - Reporting a workplace safety violation: protected by federal OSHA law,
           but you must file a complaint with OSHA within 30 days of the firing.
         - Filing a workers' compensation claim: Idaho courts treat this as a
           "public policy" claim (Idaho has no statute on it).
         - Whistleblowing: Idaho's whistleblower statute (Idaho Code 6-2101 and
           following) protects only government employees. Private-sector workers
           rely on federal laws or the narrow public-policy exception below.

      3. Breach of an employment contract - This includes written contracts and
         implied ones. An employee handbook or manual can become part of your
         contract and limit the employer's right to fire you.

      4. Violation of public policy - For example, being fired for refusing to
         break the law, for performing an important public duty, or for
         exercising a legal right.

      5. Breach of the covenant of good faith and fair dealing - Idaho implies
         this covenant in every employment relationship, but it is narrow: it
         does not turn at-will employment into for-cause employment.

      Deadlines are strict. Missing one can permanently bar your claim:
      - Idaho Human Rights Commission discrimination complaint: 1 year from the
        discrimination (Idaho Code 67-5907). You must file with the Commission
        before you can sue.
      - EEOC (federal) charge: 300 days. A charge filed with one agency can be
        cross-filed with the other.
      - Lawsuit after the agency issues a right-to-sue notice: 90 days.
      - OSHA safety-retaliation complaint: 30 days.
      - Wrongful discharge lawsuit (public policy or workers' compensation
        retaliation): 2 years.
      Act quickly, and get legal advice before the earliest deadline.

      If you believe you were wrongfully terminated:
      1. Gather documentation of your employment history and the circumstances of
         your firing. Keep your own copies of pay stubs, reviews, and
         correspondence.
      2. You can ask for your personnel file, but Idaho law does not require
         private employers to provide it (only government employers must, under
         Idaho Code 74-106 and 33-518). You are entitled to written information
         about your rate of pay and pay dates on request (Idaho Code 45-610).
      3. Note any witnesses to discriminatory or retaliatory statements.

      Also know:
      - Unemployment benefits: being fired does not disqualify you unless the
        employer proves workplace misconduct (Idaho Code 72-1366). Apply through
        the Idaho Department of Labor.
      - Final paycheck: your wages are due by the earlier of the next regular
        payday or 10 days after separation (weekends and holidays excluded), or
        within 48 hours if you ask in writing (Idaho Code 45-606). The Idaho
        Department of Labor takes wage claims.

      You may file a complaint with the Idaho Human Rights Commission (for
      discrimination) or contact Idaho Legal Aid if you meet income eligibility
      requirements.
    keywords:
      - fired
      - wrongful termination
      - terminated
      - laid off
      - discrimination
      - retaliation
      - despedido
    url_destination: /legal-help/civil-rights
    related_resources:
      - Idaho Human Rights Commission
      - EEOC

  - id: faq_employment_wages
    type: faq_item
    review_status: revised
    review_notes:
      - "Revised 2026-09-22 from the reviewer's round-1 notes on the ILAS FAQ Sign-off Sheet; awaiting re-approval in round 2."
    category: Employment
    anchor_id: how-do-i-collect-unpaid-wages
    question: "How do I collect unpaid wages?"
    answer: |
      Idaho law requires employers to pay wages at least monthly on regular paydays.

      When you are laid off or fired, or you quit, all wages you are owed are due
      by the earlier of the next regular payday or 10 days after separation
      (weekends and holidays excluded). If you ask for your final pay in writing,
      the employer must pay within 48 hours of receiving your request (weekends
      and holidays excluded). Tip: put your request in writing; that is what
      triggers the 48-hour deadline. (Idaho Code 45-606)

      If your employer owes you wages, you have several options:

      1. Request payment in writing - Send a formal written demand to your employer
      2. File a wage claim - Contact the Idaho Department of Labor to file a complaint
      3. Sue in small claims court - For amounts up to $15,000, you can file in
         small claims court without an attorney
      4. Consult with a lawyer - For larger amounts or complex situations

      Important: Keep records of all hours worked, pay stubs, and any communication
      with your employer about wages.

      Idaho Legal Aid may be able to help if you meet income eligibility requirements.
    keywords:
      - unpaid wages
      - owed money
      - final paycheck
      - wage theft
      - not getting paid
      - back pay
      - no me pagan
      - salario
    url_destination: /legal-help/civil-rights
    related_resources:
      - Idaho Department of Labor
      - Small Claims Court Guide

  # ============================================
  # UTILITIES FAQ (High Priority)
  # ============================================

  - id: faq_utility_shutoff
    type: faq_item
    review_status: approved
    reviewed_by: "Evan Curry"
    reviewed_on: "2026-09-22"
    category: Consumer
    anchor_id: what-if-my-utilities-are-being-shut-off
    question: "What if my utilities are being shut off?"
    answer: |
      If you receive a utility shutoff notice, take action immediately:

      1. Contact your utility company - Ask about payment plans, budget billing,
         or hardship programs. Many utilities offer assistance programs.

      2. Apply for LIHEAP - The Low Income Home Energy Assistance Program helps
         with heating and cooling costs. Apply through your local Community
         Action Agency.

      3. Check utility company programs:
         - Idaho Power: Project Share, medical certificate exemptions
         - Intermountain Gas: customer assistance programs
         - Most utilities offer payment arrangements

      4. Weather protections - During extreme weather, Idaho utilities may have
         moratoriums on shutoffs for vulnerable customers

      5. Medical exemptions - If someone in your home has a serious medical
         condition, you may qualify for protection from disconnection

      If your utilities are already disconnected, contact your Community Action
      Agency for emergency assistance to get reconnected.

      Idaho Legal Aid may be able to help with utility-related legal issues.
    keywords:
      - utility shutoff
      - power disconnected
      - gas turned off
      - water shut off
      - LIHEAP
      - energy assistance
      - utility bill
      - me cortaron la luz
      - ayuda con facturas
    url_destination: /legal-help/consumer
    related_resources:
      - LIHEAP
      - Community Action Agency
      - Idaho Power Customer Assistance
      - Intermountain Gas Assistance

  # ============================================
  # NAME CHANGE FAQ (Medium Priority)
  # ============================================

  - id: faq_name_change
    type: faq_item
    review_status: revised
    review_notes:
      - "Revised 2026-09-22 from the reviewer's round-1 notes on the ILAS FAQ Sign-off Sheet; awaiting re-approval in round 2."
    category: Family
    anchor_id: how-do-i-legally-change-my-name
    question: "How do I legally change my name?"
    answer: |
      In Idaho, you can legally change your name through a court process:

      Steps to change your name:
      1. File a Petition for Name Change in your county's district court
      2. Pay the filing fee (approximately $170; verify the current amount with
         your county clerk)
      3. Publish notice in a local newspaper for 4 consecutive weeks
      4. Attend a court hearing where the judge reviews your petition
      5. If approved, receive a court order for name change

      After receiving your court order:
      - Update your Social Security card first
      - Update your driver's license/state ID
      - Update your passport, bank accounts, and other documents

      Special situations:
      - Fee waiver: If you can't afford the filing fee, you can request a fee waiver
      - Minors: Requires both parents' consent or court approval
      - Name change in divorce: Can be included in your divorce decree
      - Gender-related changes: Same process applies

      Idaho Legal Aid may be able to help with name changes in some cases.
    keywords:
      - name change
      - change my name
      - legal name
      - court name change
      - cambiar mi nombre
      - cambio de nombre
    url_destination: /legal-help/family
    related_resources:
      - Idaho Court Self-Help Center
      - Name Change Forms

