# Put overrides to your pantheon.upstream.yml file here.
# For more information, see: https://pantheon.io/docs/pantheon-yml/
api_version: 1

# Pantheon Object Cache (Redis). The platform default is Redis 2.8 (EOL);
# pin the supported 6.2 engine. Drupal wiring lives in
# web/sites/default/settings.redis.php.
# Schema per https://docs.pantheon.io/object-cache/faq — the key is
# object_cache.version ('cache: redis:' fails pantheon.yml validation).
object_cache:
  version: 6.2

# Pantheon Search (Solr). Omitting this key defaults to deprecated Solr 3;
# Drupal 10+ requires 8 (stable) or 9 (beta as of 2026-04). Server config in
# config/search_api.server.pantheon_search.yml; local connector override in
# web/sites/default/settings.solr.php.
search:
  version: 8

# PHP runtime. Overrides the 8.3 default in pantheon.upstream.yml (which is
# left untouched so reverting this key rolls the site back to 8.3). Drupal 12
# requires 8.5. Deploys with code; Pantheon ignores this change in hotfixes.
php_version: 8.5

# Quicksilver hooks. Scripts live in web/private/scripts (paths here are
# relative to the docroot); /private/ is a protected web path.
#
# These fire for every code change and database clone on the platform, no
# matter who triggers it or how, which is the point: the deploy script's own
# checks only run when someone uses the deploy script.
workflows:
  # A cloned database carries a Search API tracker that no longer matches
  # this environment's Solr core. Rebuild the index so search keeps working.
  clone_database:
    after:
      - type: webphp
        description: Rebuild the Solr content index after a database clone
        script: private/scripts/reindex_search_after_clone.php
  # Code reached dev or a Multidev (git push, dashboard commit, upstream).
  sync_code:
    after:
      - type: webphp
        description: Start the GitHub site smoke after a code sync
        script: private/scripts/dispatch_site_smoke.php
  # Code was deployed to test or live.
  deploy:
    after:
      - type: webphp
        description: Start the GitHub site smoke after a deploy
        script: private/scripts/dispatch_site_smoke.php
