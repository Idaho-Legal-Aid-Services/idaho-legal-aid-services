version: 2

secret:
  ignored_matches:
    # Google API key that leaked into production logs and was embedded in the
    # PII-redaction test fixtures to validate scrubbing (introduced in commit
    # e016e230b8, replaced with a synthetic value in 83e61c859e). The literal
    # remains in those two historical commit patches, so ggshield flags every
    # push containing them. The key itself must be revoked in Google Cloud
    # Console — this entry only silences the known, already-remediated
    # fixture occurrence.
    - match: a26b55c91fcd52945b26e662ae773f91e15c4d0a8afa09e810b824d93d77c1cc
      name: Leaked Google API key formerly used as redaction test fixture
    # Synthetic replacement fixture (AIzaSyTEST-ONLY-NOT-A-REAL-KEY-00000000)
    # introduced in 83e61c859e. Shaped like a Google API key on purpose so the
    # PiiRedactor pattern matches it; it is not a credential.
    - match: 18e6489fd1e611055a063b12382a84f15957d81b944f3efe40419cdb36f5020e
      name: Synthetic Google API key test fixture (not a real credential)
    # The ddev-solr add-on's stock local-dev credentials (solr:SolrRocks) in
    # .ddev/docker-compose.solr.yaml and web/sites/default/settings.solr.php.
    # These are the add-on's published defaults for the local Solr container
    # only — they never guard anything outside the developer's machine, and
    # Pantheon Search uses its own client-certificate auth.
    - match: d74f128ffd04ad854fc49da5677cebc44d0b3732ad219fa426ece61d7b885697
      name: DDEV Solr add-on default dev credentials (solr:SolrRocks)
